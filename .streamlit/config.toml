[theme]
# WeWork 특유의 차분하고 고급스러운 블랙/다크 브라운 텍스트
textColor = "#222222"

# 메인 콘텐츠 배경색 (약간의 온기가 도는 아이보리 톤의 맑은 오프화이트)
backgroundColor = "#FAF9F6"

# 사이드바, 카드가 얹혀지는 박스 영역 등의 카드형 배경색 (완전한 오프화이트)
secondaryBackgroundColor = "#F3F1EC"

# 브랜드 강조 포인트 컬러 (WeWork의 시그니처 딥 네이비/블랙)
primaryColor = "#000000"

# 폰트 스타일 (깔끔한 무세리프 Sans-Serif 폰트 사용)
font = "sans serif"